[project]
name = "capstone-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "pathlib>=1.0.1",
    "pyttb>=1.8.5",
]

[project.scripts]
capstone-project = "capstone_project:main"

[tool.basedpyright]
extraPaths = ["src/capstone_project"]
typeCheckingMode = "off"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
